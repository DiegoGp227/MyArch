background {
    monitor =
    path = screenshot

    blur_passes = 5
    blur_size = 10

    vibrancy = 0.15
    vibrancy_darkness = 0.3
}

general {
    hide_cursor = true
}

# =====================================
# RELOJ
# =====================================

label {
    monitor =

    text = cmd[update:1000] date +"%H:%M"

    color = rgba(e9d5ffff)

    font_size = 110
    font_family = JetBrainsMono Nerd Font

    position = 0, 180

    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:1000] date +"%A %d %B %Y"

    color = rgba(c084fcff)

    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, 110

    halign = center
    valign = center
}

# =====================================
# PANEL CENTRAL
# =====================================

shape {
    monitor =

    size = 850, 170

    color = rgba(000000bb)

    border_size = 2
    border_color = rgba(c084fcff)

    rounding = 0

    position = 0, -10

    halign = center
    valign = center
}

label {
    monitor =

    text = HACK4U SECURITY

    color = rgba(c084fcff)

    font_size = 36
    font_family = JetBrainsMono Nerd Font

    position = 0, 25

    halign = center
    valign = center
}

label {
    monitor =

    text = AUTHENTICATION REQUIRED

    color = rgba(ffffffff)

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, -15

    halign = center
    valign = center
}

# =====================================
# INPUT
# =====================================

input-field {
    monitor =

    size = 500, 60

    outline_thickness = 2

    outer_color = rgba(c084fcff)
    inner_color = rgba(000000ee)

    font_color = rgba(ffffffff)

    rounding = 0

    fade_on_empty = false

    placeholder_text = ENTER PASSWORD

    position = 0, -120

    halign = center
    valign = center
}

# =====================================
# INFORMACIÓN DEL SISTEMA
# =====================================

label {
    monitor =

    text = cmd[update:10000] echo "USER: $USER"

    color = rgba(c084fcff)

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = -650, 40

    halign = center
    valign = center
}

label {
    monitor =

    text = HOST: hack4u

    color = rgba(c084fcff)

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = -650, 10

    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:10000] echo "KERNEL: $(uname -r)"

    color = rgba(c084fcff)

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = -650, -20

    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:5000] free -h | awk '/Mem:/ {print "RAM: " $3 " / " $2}'

    color = rgba(c084fcff)

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 650, 40

    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:5000] uptime -p

    color = rgba(c084fcff)

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 650, 10

    halign = center
    valign = center
}

label {
    monitor =

    text = ARCH LINUX

    color = rgba(c084fcff)

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 650, -20

    halign = center
    valign = center
}

