# =============================================================================
# HYPRLAND - Configuración modular
# =============================================================================

# Fuente de todos los archivos de configuración divididos
source = ~/.config/hypr/configs/*.conf

# =============================================================================
# REFERENCIA RÁPIDA
# =============================================================================
#
# MONITORES      ~/.config/hypr/configs/monitors.conf
# APLICACIONES   ~/.config/hypr/configs/apps.conf
# AUTOSTART      ~/.config/hypr/configs/autostart.conf
# ENTORNO        ~/.config/hypr/configs/env.conf
# APARIENCIA     ~/.config/hypr/configs/appearance.conf
# ANIMACIONES    ~/.config/hypr/configs/animations.conf
# LAYOUT         ~/.config/hypr/configs/layout.conf
# TECLADO        ~/.config/hypr/configs/input.conf
# ATAJOS         ~/.config/hypr/configs/bindings.conf
#
# BLOQUEO        ~/.config/hypr/hypridle.conf + ~/.config/hypr/hyprlock.conf
# SCRIPTS        ~/.config/hypr/scripts/
# WALLPAPER      waypaper (gestionado vía ~/.config/waypaper/config.ini)
#
# =============================================================================
